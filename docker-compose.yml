# Local stack: PostgreSQL 16 and flowd.
#   docker compose up --build
# The API is then at http://localhost:8080.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: flowd
      POSTGRES_PASSWORD: flowd
      POSTGRES_DB: flowd
    healthcheck:
      # -h probes over TCP, the way flowd connects. On the first start the
      # image runs a temporary init server that listens on the Unix socket
      # only, so a socket probe can pass while TCP is still refused.
      test: ["CMD-SHELL", "pg_isready -h localhost -U flowd"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  flowd:
    build: .
    # flowd exits when it cannot reach PostgreSQL at startup; it does not
    # retry. Restarting it covers a database that is not reachable yet, and
    # any later crash.
    restart: on-failure
    depends_on:
      # Start flowd only once PostgreSQL accepts connections.
      postgres:
        condition: service_healthy
    environment:
      FLOWD_ADDR: ":8080"
      FLOWD_DATABASE_URL: postgres://flowd:flowd@postgres:5432/flowd?sslmode=disable
      FLOWD_WORKERS: "8"
      FLOWD_LEASE: 30s
      FLOWD_POLL: 200ms
    ports:
      # The API has no authentication, so publish it on localhost only.
      - "127.0.0.1:8080:8080"
    # Room for the graceful shutdown (in-flight requests and steps) before
    # Docker sends SIGKILL.
    stop_grace_period: 30s

volumes:
  pgdata:
